
name: build

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: commet

jobs:
  build-windows:
    # Full matrix only when a tag is created. Pushes to `dev` skip all jobs.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Artifact version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${GITHUB_SHA:0:7}"
          fi
          echo "version=${v//\//-}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Configure Flutter
        run: flutter config --enable-windows-desktop

      - name: Code Generation
        run: |
          cd .\commet
          git config --global core.longpaths true
          dart run scripts/codegen.dart

      - name: Build Windows App
        run: |
          cd .\commet
          flutter build windows --release --dart-define PLATFORM=windows

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commet-windows-${{ steps.meta.outputs.version }}
          path: commet/build/windows/x64/runner/Release
          retention-days: 14

  build-macos:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Artifact version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${GITHUB_SHA:0:7}"
          fi
          echo "version=${v//\//-}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}-${{ hashFiles('commet/pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Configure Flutter
        run: flutter config --enable-macos-desktop

      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Align CocoaPods WebRTC-SDK pins
        run: |
          cd $PROJECT_PATH
          bash scripts/align_macos_webrtc_pods.sh

      - name: Build macOS App
        run: |
          cd $PROJECT_PATH
          flutter build macos --release --dart-define PLATFORM=macos

      - name: Sign and package .app
        run: |
          set -euo pipefail
          APP="$PROJECT_PATH/build/macos/Build/Products/Release/commet.app"
          # Ad-hoc sign the whole bundle so embedded frameworks (e.g. Ass) load.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dist
          # KeepParent so the zip's top-level folder is commet.app, not the artifact name.
          ditto -c -k --keepParent "$APP" "dist/commet-macos-${{ steps.meta.outputs.version }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/commet-macos-${{ steps.meta.outputs.version }}.zip
          archive: false
          retention-days: 14

  build-android:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      # Free disk without wiping hostedtoolcache (that forces a full Flutter reinstall).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/julia* \
            /usr/local/share/chromium /opt/microsoft /opt/google /opt/az || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Artifact version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${GITHUB_SHA:0:7}"
          fi
          echo "version=${v//\//-}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Build APK
        run: |
          cd $PROJECT_PATH
          flutter build apk --debug --dart-define PLATFORM=android

      - name: Prepare APK for upload
        id: prepare
        run: |
          DEST="commet-android-debug-${{ steps.meta.outputs.version }}.apk"
          cp "$PROJECT_PATH/build/app/outputs/flutter-apk/app-debug.apk" "$DEST"
          echo "apk_filename=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare.outputs.apk_filename }}
          archive: false
          retention-days: 14

  build-linux:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Artifact version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${GITHUB_SHA:0:7}"
          fi
          echo "version=${v//\//-}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev webkit2gtk-4.1 keybinder-3.0

      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Build Linux
        run: |
          cd $PROJECT_PATH
          flutter build linux --release --dart-define PLATFORM=linux

      - name: Bundle libmpv and runtime deps
        run: |
          cd $PROJECT_PATH
          bash scripts/bundle_linux_runtime_libs.sh build/linux/x64/release/bundle
          test -f build/linux/x64/release/bundle/lib/libmpv.so.2
          test -f build/linux/x64/release/bundle/lib/libXpresent.so.1
          LD_LIBRARY_PATH="$PWD/build/linux/x64/release/bundle/lib" \
            ldd build/linux/x64/release/bundle/commet.bin | tee /tmp/commet-ldd.txt
          grep -q 'libmpv.so.2 => .*/bundle/lib/libmpv.so.2' /tmp/commet-ldd.txt \
            || (echo "libmpv was not resolved from the bundle lib dir" >&2; exit 1)

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commet-linux-${{ steps.meta.outputs.version }}
          path: commet/build/linux/x64/release/bundle
          retention-days: 14

  build-web:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Artifact version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${GITHUB_SHA:0:7}"
          fi
          echo "version=${v//\//-}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Build Web
        run: |
          cd $PROJECT_PATH
          flutter build web --release --dart-define PLATFORM=web

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commet-web-${{ steps.meta.outputs.version }}
          path: commet/build/web
          retention-days: 14
