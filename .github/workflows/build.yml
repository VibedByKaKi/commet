
name: build

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: commet

jobs:
  build-windows:
    # Full matrix only when a tag is created. Pushes to `dev` skip all jobs.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Configure Flutter
        run: flutter config --enable-windows-desktop
        
      - name: Code Generation
        run: |
          cd .\commet
          git config --global core.longpaths true
          dart run scripts/codegen.dart

      - name: Build Windows App
        run: |
          cd .\commet
          flutter build windows --release --dart-define PLATFORM=windows

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commet-windows
          path: commet/build/windows/x64/runner/Release
          retention-days: 14

  build-macos:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Configure Flutter
        run: flutter config --enable-macos-desktop

      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Align CocoaPods WebRTC-SDK pins
        run: |
          cd $PROJECT_PATH
          bash scripts/align_macos_webrtc_pods.sh

      - name: Build macOS App
        run: |
          cd $PROJECT_PATH
          flutter build macos --release --dart-define PLATFORM=macos

      - name: Sign and package .app
        run: |
          set -euo pipefail
          APP="$PROJECT_PATH/build/macos/Build/Products/Release/commet.app"
          # Ad-hoc sign the whole bundle so embedded frameworks (e.g. Ass) load.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dist
          # KeepParent so the zip's top-level folder is commet.app, not the artifact name.
          ditto -c -k --keepParent "$APP" "dist/commet-macos-${{ github.ref_name }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/commet-macos-${{ github.ref_name }}.zip
          archive: false
          retention-days: 14

  build-android:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      # we were having issues running out of disk space on workers, so...
      - name: Aggressive cleanup
        run: |
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google

          # Remove Azure CLI
          sudo rm -rf /opt/az

          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache

          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg 
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Build APK
        run: |
          cd $PROJECT_PATH
          flutter build apk --debug --dart-define PLATFORM=android

      - name: Prepare APK for upload
        id: prepare
        run: |
          DEST="commet-android-debug.apk"
          cp "$PROJECT_PATH/build/app/outputs/flutter-apk/app-debug.apk" "$DEST"
          echo "apk_filename=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare.outputs.apk_filename }}
          archive: false
          retention-days: 14

  build-android-google-services:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # we were having issues running out of disk space on workers, so...
      - name: Aggressive cleanup
        run: |
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet
  
          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup
  
          # Remove Julia
          sudo rm -rf /usr/local/julia*
  
          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium
  
          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google
  
          # Remove Azure CLI
          sudo rm -rf /opt/az
  
          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache
  
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          git apply scripts/apply_google_services.patch
          dart run scripts/codegen.dart

      - name: Build APK
        run: |
          cd $PROJECT_PATH
          flutter build apk --debug --dart-define ENABLE_GOOGLE_SERVICES=true --dart-define PLATFORM=android

      - name: Prepare APK for upload
        id: prepare
        run: |
          DEST="commet-android-google-services-debug.apk"
          cp "$PROJECT_PATH/build/app/outputs/flutter-apk/app-debug.apk" "$DEST"
          echo "apk_filename=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare.outputs.apk_filename }}
          archive: false
          retention-days: 14

  build-linux:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev webkit2gtk-4.1 keybinder-3.0
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart
          
      - name: Build Linux
        run: |
          cd $PROJECT_PATH
          flutter build linux --release --dart-define PLATFORM=linux

      - name: Run App
        run: |
          ldd $PROJECT_PATH/build/linux/x64/release/bundle/commet

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commet-linux
          path: commet/build/linux/x64/release/bundle
          retention-days: 14

  build-web:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter 
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg
        
      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Build Web
        run: |
          cd $PROJECT_PATH
          flutter build web --release --dart-define PLATFORM=web

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commet-web
          path: commet/build/web
          retention-days: 14
