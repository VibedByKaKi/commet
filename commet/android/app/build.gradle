plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    // id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion flutter.compileSdkVersion
    namespace = "chat.halley.halleyapp"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "chat.halley.halleyapp"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Plugins still ship armeabi-v7a / x86_64 .so files even when Flutter is
        // built with --target-platform=android-arm64; drop them from the APK.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // abiFilters alone does not strip plugin-shipped .so files; exclude them
    // from the APK explicitly. Compress JNI so arm64 libs don't land STORE'd.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += [
                "lib/armeabi/**",
                "lib/armeabi-v7a/**",
                "lib/x86/**",
                "lib/x86_64/**",
            ]
        }
        resources {
            pickFirsts += [
                'lib/arm64-v8a/libc++_shared.so',
            ]
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.compose.ui:ui-unit:1.11.2'
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}

// Belt-and-suspenders: some Flutter plugins still merge foreign ABIs past
// packaging.jniLibs.excludes. Drop them from the merged native-libs folder.
tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("NativeLibs")) {
        task.doLast {
            def roots = [] as Set
            task.outputs.files.each { f ->
                if (f.directory) roots << f
            }
            try {
                def prop = task.hasProperty("outputDir") ? task.outputDir : null
                if (prop != null) {
                    roots << (prop.respondsTo("get") ? prop.get().asFile : prop)
                }
            } catch (Exception ignored) {
                // outputDir shape varies across AGP versions
            }
            ["armeabi", "armeabi-v7a", "x86", "x86_64"].each { abi ->
                roots.each { root ->
                    def dir = new File(root as File, abi)
                    if (dir.exists()) {
                        logger.lifecycle("Stripping non-arm64 JNI: ${dir}")
                        delete dir
                    }
                }
            }
        }
    }
}
